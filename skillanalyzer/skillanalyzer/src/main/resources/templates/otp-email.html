
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <title>OTP Email</title>
    <style>
        /* inline CSS for better deliverability */
        .box { font-family: Arial, sans-serif; color:#222; }
        .code { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
<div class="box">

    <p>Assalamualaikum,</p>

    <p>Your One-Time Password (OTP) for <strong>Password Reset</strong> is:</p>

    <p class="code" th:text="${otp}">123456</p>

    <p>This code will expire in <strong th:text="${minutes}">15</strong> minutes.</p>

    <p>If you did not request a password reset, please disregard this email. Your account remains secure.</p>

</div>
</body>
</html>
