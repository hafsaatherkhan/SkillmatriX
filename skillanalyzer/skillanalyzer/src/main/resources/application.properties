# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.application.name=skillanalyzer
gemini.api-key.skill-extraction= ${GEMINI_API_KEY}
gemini.api-key.roadmap=${GEMINI_API_KEY}
gemini.api-key=${GEMINI_API_KEY}
# ===== Adzuna API =====
adzuna.app-id=${API_ID}
adzuna.api-key=${API_KEY}



# =======================
# MySQL datasource
# =======================
spring.datasource.url=jdbc:mysql://localhost:3306/skillmatrix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your-password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# IMPORTANT with Hibernate 6/7:
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Optional (driver can be auto-detected)
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =======================
# File storage base path
# =======================
# Where your backend will save uploaded PDFs (from frontend Puppeteer)
storage.base-path=Your folder path

